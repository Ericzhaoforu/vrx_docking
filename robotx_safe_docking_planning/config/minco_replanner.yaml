minco_replanner_node:
  ros__parameters:
    use_sim_time: true

    odom_topic: /safe_docking/odometry
    trajectory_topic: /safe_docking/minco_trajectory
    status_topic: /safe_docking/minco_planner_status
    execution_status_topic: /safe_docking/minco_execution_status
    frame_id: map

    planner_rate_hz: 1.0
    check_rate_hz: 1.0
    progress_distance: 0.5
    progress_yaw: 0.12
    no_replan_goal_distance: 0.5
    no_replan_goal_yaw: 0.08
    max_replan_tracking_position_error: 0.75
    max_replan_tracking_yaw_error: 0.70

    global_goal: [3.0, 6.0, 2.4]

    mass: 180.0
    iz: 446.0
    du: 100.0
    duu: 150.0
    dv: 100.0
    dvv: 100.0
    dr: 800.0
    drr: 800.0
    thruster_half_spacing: 1.027135
    min_thrust: -100.0
    max_thrust: 100.0

    # Fast-Planner-style USV motion-primitive front end. Primitives are
    # generated by sampling differential-thrust commands, mapping them to
    # [tau_u, tau_r], and rolling the nominal underactuated USV model with
    # tau_v = 0.
    frontend_primitive_duration: 2.0
    frontend_primitive_dt: 0.25
    frontend_check_num: 5
    frontend_search_depth: 24
    frontend_max_expansions: 2000
    frontend_control_discretization: 1
    frontend_sample_thrust_limit: 60.0
    frontend_minco_piece_count_min: 3
    frontend_minco_piece_count_max: 8
    frontend_flat_accel_bounds: [0.6, 0.12, 0.35]
    frontend_flat_velocity_bounds: [0.9, 0.10, 0.20]
    frontend_time_weight: 1.0
    frontend_heuristic_weight: 3.0
    frontend_tau_v_bar: 12.0
    frontend_max_local_goal_distance: 5.0
    frontend_local_goal_speed: 0.45
    frontend_final_goal_radius: 0.8
    frontend_goal_tolerance: 0.15
    frontend_yaw_tolerance: 0.12
    frontend_obstacle_margin: 0.5
    frontend_grid_resolution_xy: 0.25
    frontend_grid_resolution_yaw: 0.25
    frontend_grid_resolution_vxy: 0.25
    frontend_grid_resolution_yaw_rate: 0.05
    frontend_analytic_expansion: true

    # Strict GCOPTER/MINCO-S3NU optimizer. The planner passes the primitive
    # chain as initial q/T; polynomial coefficients are generated only through
    # the MINCO linear system and are not optimization variables.
    minco_dt: 0.1
    minco_fixed_total_time: true
    minco_reference_speed: 0.45
    minco_time_dilation: 1.3
    minco_min_segment_time: 0.2
    minco_smooth_weight: 1.0
    minco_time_weight: 0.0
    minco_max_iterations: 80
    minco_gradient_tolerance: 1.0e-6
    minco_function_tolerance: 1.0e-9
    minco_spatial_margin: 2.0
    minco_yaw_margin: 1.0
    minco_theta_bound: 6.0
    minco_tau_v_bar: 12.0
    minco_velocity_bounds: [0.9, 0.10, 0.20]
    minco_acceleration_bounds: [0.6, 0.12, 0.35]
    minco_lambda_tau_v: 1.0
    minco_lambda_velocity: 1.0
    minco_lambda_acceleration: 1.0
    minco_lambda_actuator: 10.0
    minco_quadrature_order: 8
    minco_penalty_mu: 20.0

    accept_tau_v_margin: 0.5
    accept_velocity_violation: 1.0e-3
    accept_acceleration_violation: 1.0e-3
    accept_actuator_violation: 1.0e-3
    accept_pva_residual: 1.0e-5
    accept_continuity_residual: 1.0e-5
    accept_penalty_total: 10000000.0
