cascaded_pid_controller:
  ros__parameters:
    use_sim_time: true

    odom_topic: /safe_docking/odometry
    left_thrust_topic: /wamv/thrusters/left/thrust
    right_thrust_topic: /wamv/thrusters/right/thrust
    command_topic: /safe_docking/controller/command
    debug_topic: /safe_docking/controller/debug

    control_rate_hz: 20.0
    command_timeout_sec: 0.5

    # Final target kept for recorders and backward compatibility.
    target_x: 6.0
    target_y: 12.0
    target_yaw: 2.4

    # Path waypoints in the EKF local frame. Set waypoint_yaw_specified false
    # to let the optimizer choose the local path heading at that waypoint.
    waypoint_xs: [4.0, 6.0]
    waypoint_ys: [8.0, 12.0]
    waypoint_yaws: [0.0, 2.4]
    waypoint_yaw_specified: [false, true]
    position_tolerance: 0.20
    yaw_tolerance: 0.08
    goal_speed_tolerance: 0.15
    # Kept for compatibility; intermediate waypoints are now path constraints,
    # not switching targets.
    waypoint_tolerance: 0.75

    # B-spline trajectory generation. If SciPy trajectory optimization fails,
    # the controller publishes zero thrust instead of falling back.
    kappa_max: 0.7
    curvature_check_samples: 240
    kappa_feasibility_tolerance: 1.01
    bspline_degree: 3
    bspline_control_points: 8
    bspline_enforce_waypoints: true
    bspline_waypoint_tolerance: 0.05
    bspline_waypoint_weight: 2500.0
    bspline_yaw_weight: 40.0
    bspline_smoothness_weight: 0.05
    bspline_control_regularization: 0.002
    bspline_control_margin: 20.0
    bspline_optimizer_samples: 300
    bspline_optimizer_max_iterations: 220
    bspline_max_handle: 40.0
    bspline_curvature_penalty: 20000.0
    bspline_peak_curvature_penalty: 50.0
    bspline_curvature_smoothness: 0.02

    # Arc-length trajectory speed profile and nonlinear body-frame tracker.
    trajectory_samples: 800
    trajectory_max_lead: 0.05
    trajectory_accel_max: 0.06
    trajectory_decel_max: 0.06
    tracking_kx: 0.35
    tracking_ky: 2.50
    tracking_kpsi: 0.80
    tracking_min_speed_for_lateral: 0.45
    cruise_speed: 0.30
    min_speed: -0.25
    max_speed: 0.45
    max_lateral_accel: 0.10
    kappa_eps: 0.001
    max_yaw_rate: 0.55

    # Body-frame surge speed PI loop.
    surge_kp: 220.0
    surge_ki: 12.0
    surge_drag_linear: 70.0
    surge_drag_quadratic: 140.0
    max_surge_force: 650.0
    surge_integral_limit: 10.0

    # Yaw-rate PI loop. The output is the desired yaw moment.
    yaw_rate_kp: 900.0
    yaw_rate_ki: 25.0
    yaw_rate_kd: 0.0
    max_yaw_moment: 1300.0
    yaw_rate_integral_limit: 2.5

    # Aft H-thruster geometry and constrained least-squares allocation.
    thruster_half_spacing: 1.027135
    min_thrust: -500.0
    max_thrust: 500.0
    thrust_rate_limit: 1000.0
    allocation_weight_force: 1.0
    allocation_weight_torque: 3.0
    allocation_smooth_weight: 0.03
    surge_aw_threshold: 80.0
    yaw_aw_threshold: 180.0

    stop_when_reached: false
