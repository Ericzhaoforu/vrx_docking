flatness_mpc_controller:
  ros__parameters:
    use_sim_time: true

    odom_topic: /safe_docking/odometry
    left_thrust_topic: /wamv/thrusters/left/thrust
    right_thrust_topic: /wamv/thrusters/right/thrust
    command_topic: /safe_docking/flatness_mpc/command
    debug_topic: /safe_docking/flatness_mpc/debug

    control_rate_hz: 20.0
    command_timeout_sec: 0.8

    # Synthetic references are generated by rolling out feasible differential
    # thrust commands through the nominal USV model.
    reference_source: synthetic  # synthetic, minco, or minco_topic
    reference_name: arc
    reference_dt: 0.2
    minco_trajectory_topic: /safe_docking/minco_trajectory
    minco_execution_status_topic: /safe_docking/minco_execution_status
    minco_execution_start_delay: 0.0
    minco_topic_accept_start_position_tolerance: 0.75
    minco_topic_accept_start_yaw_tolerance: 0.70
    minco_topic_accept_start_velocity_tolerance: 1.0

    # MINCO local reference generation. These parameters are used only when
    # reference_source is set to "minco"; the existing NMPC tracker remains
    # unchanged and consumes the generated FeasibleReference horizon.
    minco_terminal_forward: 1.5
    minco_terminal_lateral: 0.25
    minco_terminal_yaw: 0.15
    # Default one-shot MINCO piece count. The goal_lattice front end overrides
    # this with M = clamp(selected_depth, frontend_minco_piece_count_min,
    # frontend_minco_piece_count_max).
    minco_piece_count: 2
    minco_fixed_total_time: 18.0
    minco_reference_speed: 0.6
    minco_time_dilation: 1.5
    minco_min_segment_time: 0.3
    minco_smooth_weight: 1.0
    minco_time_weight: 0.0
    minco_max_iterations: 200
    minco_tau_v_bar: 12.0
    minco_velocity_bounds: [2.0, 0.5, 0.6]
    minco_acceleration_bounds: [0.9, 0.5, 0.8]
    minco_lambda_tau_v: 1.0
    minco_lambda_velocity: 1.0
    minco_lambda_acceleration: 1.0
    minco_lambda_actuator: 10.0
    minco_quadrature_order: 8
    minco_penalty_mu: 20.0
    minco_replan_enabled: false
    minco_replan_check_rate_hz: 1.0
    minco_replan_progress_distance: 0.5
    minco_replan_progress_yaw: 0.12
    minco_no_replan_goal_distance: 0.5
    minco_no_replan_goal_yaw: 0.08
    minco_replan_modes: straight,gentle_arc
    minco_accept_pva_residual: 0.00001
    minco_accept_start_z_tolerance: 0.05
    minco_accept_start_z_dot_tolerance: 0.05
    minco_accept_tau_v_bound: 12.0
    minco_accept_velocity_violation: 0.05
    minco_accept_acceleration_violation: 0.05
    minco_accept_actuator_violation: 2.0
    minco_accept_penalty_total: 10000000.0
    minco_handover_duration: 0.0

    # Fast-Planner-style kinodynamic front end. When reference_name is
    # goal_lattice, the front end expands sampled differential-thrust USV
    # primitives toward frontend_goal_z while preserving Fast-Planner-style
    # A* ranking and heuristic logic. The accepted path seeds MINCO.
    # Obstacles are intentionally empty here; a future local-map layer should
    # populate them as "x,y,r;x,y,r" without using Gazebo ground truth.
    frontend_goal_z: [3.0, 6.0, 2.4]
    frontend_primitive_duration: 2.0
    frontend_primitive_dt: 0.25
    frontend_check_num: 5
    frontend_search_depth: 24
    frontend_max_expansions: 2000
    frontend_control_discretization: 1
    frontend_sample_thrust_limit: 0.0
    frontend_minco_piece_count_min: 3
    frontend_minco_piece_count_max: 8
    frontend_flat_accel_bounds: [0.5, 0.5, 0.12]
    frontend_flat_velocity_bounds: [2.0, 2.0, 0.4]
    frontend_time_weight: 1.0
    frontend_heuristic_weight: 3.0
    frontend_tau_v_bar: 12.0
    frontend_max_local_goal_distance: 5.0
    frontend_local_goal_speed: 0.45
    frontend_final_goal_radius: 0.8
    frontend_goal_tolerance: 0.15
    frontend_yaw_tolerance: 0.12
    frontend_obstacle_margin: 0.5
    frontend_grid_resolution_xy: 0.25
    frontend_grid_resolution_yaw: 0.25
    frontend_grid_resolution_vxy: 0.25
    frontend_grid_resolution_yaw_rate: 0.05
    frontend_analytic_expansion: true
    frontend_obstacles: ""

    solver_backend: acados
    acados_source_dir: /home/zjy/acados
    acados_codegen_dir: /tmp/robotx_safe_docking_acados
    acados_qp_solver: PARTIAL_CONDENSING_HPIPM
    acados_nlp_solver_type: SQP
    acados_integrator_type: DISCRETE
    acados_max_iter: 80
    acados_levenberg_marquardt: 0.001
    acados_regularize_method: CONVEXIFY
    acados_globalization: MERIT_BACKTRACKING

    # RK4 dynamics-MPC horizon. The predicted state is
    # [x, y, psi, x_dot, y_dot, psi_dot, tau_v_slack, tau_u_prev, tau_r_prev],
    # the control input is [tau_u, tau_v, tau_r], and tau_v_slack is carried as
    # a constant state over the nonuniform shooting grid. The previous-input
    # states are optimizer bookkeeping for command-step penalties.
    horizon_steps: 12
    horizon_dt: 0.25
    horizon_dt_sequence: [0.08, 0.08, 0.10, 0.12, 0.15, 0.20, 0.25, 0.35, 0.45, 0.55, 0.70, 0.97]
    scale_running_cost_by_dt: true
    solver_max_iterations: 60
    solver_ftol: 0.001
    accel_bound_xy: 0.9
    yaw_accel_bound: 0.8

    # LWM-style tracking and feasibility weights. Running reference weights are
    # intentionally modest; terminal matching and tau_v slack dominate.
    q_position: 4.0
    q_yaw: 3.0
    q_velocity: 2.0
    q_yaw_rate: 1.5
    q_terminal_position: 300.0
    q_terminal_yaw: 100.0
    q_terminal_velocity: 300.0
    q_terminal_yaw_rate: 100.0
    q_tau_u: 0.001
    q_tau_r: 0.0004
    q_tau_v_slack: 20.0
    q_delta_tau: 0.004
    tau_v_slack_max: 0.05
    tau_v_slack_warm_start: 0.01
    constraint_violation_tolerance: 0.005

    # Nominal WAM-V model and actuator limits.
    mass: 180.0
    iz: 446.0
    du: 100.0
    duu: 150.0
    dv: 100.0
    dvv: 100.0
    dr: 800.0
    drr: 800.0
    thruster_half_spacing: 1.027135
    min_thrust: -100.0
    max_thrust: 100.0
    thrust_rate_limit: 1000.0
