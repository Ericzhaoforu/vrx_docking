flatness_mpc_controller:
  ros__parameters:
    use_sim_time: true

    odom_topic: /safe_docking/odometry
    left_thrust_topic: /wamv/thrusters/left/thrust
    right_thrust_topic: /wamv/thrusters/right/thrust
    command_topic: /safe_docking/flatness_mpc/command
    debug_topic: /safe_docking/flatness_mpc/debug

    control_rate_hz: 20.0
    command_timeout_sec: 0.8

    # Synthetic references are generated by rolling out feasible differential
    # thrust commands through the nominal USV model.
    reference_name: arc
    reference_dt: 0.2
    solver_backend: acados
    acados_source_dir: /home/zjy/acados
    acados_codegen_dir: /tmp/robotx_safe_docking_acados
    acados_qp_solver: PARTIAL_CONDENSING_HPIPM
    acados_nlp_solver_type: SQP
    acados_integrator_type: DISCRETE
    acados_max_iter: 80
    acados_levenberg_marquardt: 0.001
    acados_regularize_method: CONVEXIFY
    acados_globalization: MERIT_BACKTRACKING

    # RK4 dynamics-MPC horizon. The predicted state is
    # [x, y, psi, x_dot, y_dot, psi_dot, tau_v_slack, tau_u_prev, tau_r_prev],
    # the control input is [tau_u, tau_v, tau_r], and tau_v_slack is carried as
    # a constant state over the nonuniform shooting grid. The previous-input
    # states are optimizer bookkeeping for command-step penalties.
    horizon_steps: 12
    horizon_dt: 0.25
    horizon_dt_sequence: [0.08, 0.08, 0.10, 0.12, 0.15, 0.20, 0.25, 0.35, 0.45, 0.55, 0.70, 0.97]
    solver_max_iterations: 60
    solver_ftol: 0.001
    accel_bound_xy: 0.9
    yaw_accel_bound: 0.8

    # LWM-style tracking and feasibility weights. Running reference weights are
    # intentionally modest; terminal matching and tau_v slack dominate.
    q_position: 4.0
    q_yaw: 3.0
    q_velocity: 2.0
    q_yaw_rate: 1.5
    q_terminal_position: 700.0
    q_terminal_yaw: 320.0
    q_terminal_velocity: 200.0
    q_terminal_yaw_rate: 100.0
    q_tau_u: 0.001
    q_tau_r: 0.0004
    q_tau_v_slack: 20.0
    q_delta_tau: 0.004
    tau_v_slack_max: 0.05
    tau_v_slack_warm_start: 0.01
    constraint_violation_tolerance: 0.005

    # Nominal WAM-V model and actuator limits.
    mass: 180.0
    iz: 446.0
    du: 100.0
    duu: 150.0
    dv: 100.0
    dvv: 100.0
    dr: 800.0
    drr: 800.0
    thruster_half_spacing: 1.027135
    min_thrust: -100.0
    max_thrust: 100.0
    max_yaw_moment: 100.0
    thrust_rate_limit: 1000.0
