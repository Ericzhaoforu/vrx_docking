<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">B-spline trajectory tracker architecture for WAM-V safe docking</title>
  <desc id="desc">Block diagram of the implemented controller: EKF odometry and waypoints feed a SciPy B-spline optimizer, arc-length speed profiler, nonlinear body-frame trajectory tracker, surge PI loop, yaw-rate PID loop, constrained thrust allocation, WAM-V plant, GPS and IMU sensors, and EKF feedback.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#243044"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .lane { fill: #f7f9fc; stroke: #d8e0ea; stroke-width: 1.5; }
      .input { fill: #edf6ff; stroke: #23689b; stroke-width: 2.2; }
      .traj { fill: #eefaf3; stroke: #287344; stroke-width: 2.2; }
      .track { fill: #fff8e8; stroke: #9a6a00; stroke-width: 2.2; }
      .loop { fill: #f7f2ff; stroke: #6947a8; stroke-width: 2.2; }
      .alloc { fill: #fff1f4; stroke: #9b3150; stroke-width: 2.2; }
      .plant { fill: #f4f4f5; stroke: #4a5568; stroke-width: 2.2; }
      .sensor { fill: #eefaf8; stroke: #16756b; stroke-width: 2.2; }
      .arrow { stroke: #243044; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #526174; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      .title { font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Arial, sans-serif; font-size: 15px; fill: #506075; }
      .laneTitle { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #526174; }
      .label { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #172033; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #263244; }
      .math { font-family: monospace; font-size: 12px; fill: #1c2736; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="820"/>
  <text x="750" y="38" text-anchor="middle" class="title">B-Spline Trajectory Tracker For Two-Thruster WAM-V Docking</text>
  <text x="750" y="64" text-anchor="middle" class="subtitle">A single nonlinear tracker replaces the previous course guidance; only surge force and yaw moment are allocated.</text>

  <rect class="lane" x="28" y="92" width="1444" height="220" rx="10"/>
  <text x="52" y="120" class="laneTitle">TRAJECTORY GENERATION</text>
  <rect class="lane" x="28" y="344" width="1444" height="220" rx="10"/>
  <text x="52" y="372" class="laneTitle">TRACKING, INNER LOOPS, AND ALLOCATION</text>
  <rect class="lane" x="28" y="596" width="1444" height="172" rx="10"/>
  <text x="52" y="624" class="laneTitle">PLANT, SENSORS, AND ESTIMATION FEEDBACK</text>

  <rect class="input" x="60" y="145" width="210" height="112" rx="10"/>
  <text x="165" y="174" text-anchor="middle" class="label">Inputs</text>
  <text x="165" y="199" text-anchor="middle" class="math">waypoints p_i, psi_i</text>
  <text x="165" y="221" text-anchor="middle" class="math">EKF odom p, v, psi, r</text>
  <text x="165" y="243" text-anchor="middle" class="small">no autonomy ground truth</text>

  <rect class="traj" x="325" y="130" width="260" height="142" rx="10"/>
  <text x="455" y="159" text-anchor="middle" class="label">SciPy B-Spline Optimizer</text>
  <text x="455" y="184" text-anchor="middle" class="math">p(s), psi_d(s), kappa(s)</text>
  <text x="455" y="207" text-anchor="middle" class="math">waypoint and yaw constraints</text>
  <text x="455" y="230" text-anchor="middle" class="math">sampled |kappa| &lt;= kappa_max</text>
  <text x="455" y="253" text-anchor="middle" class="small">failure publishes zero thrust</text>

  <rect class="traj" x="645" y="130" width="260" height="142" rx="10"/>
  <text x="775" y="159" text-anchor="middle" class="label">Arc-Length Speed Profile</text>
  <text x="775" y="184" text-anchor="middle" class="math">u_d(s) from speed limits</text>
  <text x="775" y="207" text-anchor="middle" class="math">accel / brake passes</text>
  <text x="775" y="230" text-anchor="middle" class="math">r_d = u_d kappa</text>
  <text x="775" y="253" text-anchor="middle" class="small">terminal speed forced to zero</text>

  <rect class="traj" x="965" y="130" width="260" height="142" rx="10"/>
  <text x="1095" y="159" text-anchor="middle" class="label">Monotonic Reference</text>
  <text x="1095" y="184" text-anchor="middle" class="math">arc_ref = closest + lead</text>
  <text x="1095" y="207" text-anchor="middle" class="math">arc_ref never decreases</text>
  <text x="1095" y="230" text-anchor="middle" class="math">x_d, y_d, psi_d, u_d, r_d</text>
  <text x="1095" y="253" text-anchor="middle" class="small">no waypoint target switch</text>

  <rect class="track" x="130" y="398" width="292" height="126" rx="10"/>
  <text x="276" y="427" text-anchor="middle" class="label">Body-Frame Tracker</text>
  <text x="276" y="452" text-anchor="middle" class="math">e_B = R(psi)^T (p_d - p)</text>
  <text x="276" y="475" text-anchor="middle" class="math">u_cmd = u_d cos(e_psi) + k_x e_x</text>
  <text x="276" y="498" text-anchor="middle" class="math">r_cmd = r_d + k_y u_eff e_y + k_psi sin(e_psi)</text>

  <rect class="loop" x="500" y="398" width="225" height="126" rx="10"/>
  <text x="612" y="427" text-anchor="middle" class="label">Surge PI</text>
  <text x="612" y="452" text-anchor="middle" class="math">e_u = u_cmd - u</text>
  <text x="612" y="475" text-anchor="middle" class="math">drag feedforward</text>
  <text x="612" y="498" text-anchor="middle" class="math">u_cmd -> F_x</text>

  <rect class="loop" x="790" y="398" width="225" height="126" rx="10"/>
  <text x="902" y="427" text-anchor="middle" class="label">Yaw-Rate PID</text>
  <text x="902" y="452" text-anchor="middle" class="math">e_r = r_cmd - psi_dot</text>
  <text x="902" y="475" text-anchor="middle" class="math">rate feedback</text>
  <text x="902" y="498" text-anchor="middle" class="math">r_cmd -> tau_z</text>

  <rect class="alloc" x="1080" y="386" width="285" height="150" rx="10"/>
  <text x="1222" y="415" text-anchor="middle" class="label">Constrained Allocation</text>
  <text x="1222" y="440" text-anchor="middle" class="math">min ||A_aug T - b_aug||^2</text>
  <text x="1222" y="463" text-anchor="middle" class="math">T = [T_L, T_R]^T</text>
  <text x="1222" y="486" text-anchor="middle" class="math">F_c = T_L + T_R</text>
  <text x="1222" y="509" text-anchor="middle" class="math">tau_c = l(T_R - T_L)</text>

  <rect class="plant" x="1080" y="648" width="285" height="82" rx="10"/>
  <text x="1222" y="677" text-anchor="middle" class="label">WAM-V + VRX Plant</text>
  <text x="1222" y="702" text-anchor="middle" class="math">direct left/right thrust commands</text>

  <rect class="sensor" x="650" y="648" width="245" height="82" rx="10"/>
  <text x="772" y="677" text-anchor="middle" class="label">GPS / IMU Sensors</text>
  <text x="772" y="702" text-anchor="middle" class="math">NavSatFix and Imu</text>

  <rect class="sensor" x="250" y="648" width="250" height="82" rx="10"/>
  <text x="375" y="677" text-anchor="middle" class="label">GPS / IMU EKF</text>
  <text x="375" y="702" text-anchor="middle" class="math">/safe_docking/odometry</text>

  <path class="arrow" d="M270 201 H325"/>
  <path class="arrow" d="M585 201 H645"/>
  <path class="arrow" d="M905 201 H965"/>
  <path class="arrow" d="M1095 272 V334 H276 V398"/>
  <path class="arrow" d="M422 461 H500"/>
  <path class="arrow" d="M725 461 H790"/>
  <path class="arrow" d="M1015 461 H1080"/>
  <path class="arrow" d="M1222 536 V648"/>
  <path class="arrow" d="M1080 690 H895"/>
  <path class="arrow" d="M650 690 H500"/>
  <path class="feedback" d="M250 690 H110 V201 H60"/>
  <path class="feedback" d="M375 648 V560 H276 V524"/>
</svg>
